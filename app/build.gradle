plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

def promotedWebRtcProperties = new java.util.Properties()
rootProject.file("tools/webrtc/webrtc-promoted.env").withInputStream {
    promotedWebRtcProperties.load(it)
}

def gelWebRtcVersion = promotedWebRtcProperties.getProperty("WEBRTC_PROMOTED_VERSION")
def gelWebRtcProductionAsset = promotedWebRtcProperties.getProperty("WEBRTC_PRODUCTION_ASSET")
def gelWebRtcProductionSha256 = promotedWebRtcProperties.getProperty("WEBRTC_PRODUCTION_SHA256")
def gelWebRtcLibrary = promotedWebRtcProperties.getProperty("WEBRTC_LIBRARY")
def gelWebRtcProductionAar = file("libs/${gelWebRtcProductionAsset}")
def gelWebRtcSymbolsDir = rootProject.file(
        promotedWebRtcProperties.getProperty("WEBRTC_SYMBOL_DIR")
)


android {
    namespace = "com.gel.cleaner"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId = "com.gel.iDoctor"
        minSdk = 26
        targetSdk = 36
        versionCode = 52
        versionName = "5.2"

// ✅ SINGLE SOURCE OF ABI TRUTH
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
buildTypes {
        release {
            ndk {
                debugSymbolLevel 'symbol_table'
            }

            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                // WebRTC is a promoted third-party native library. Crashlytics must
                // read symbols from the matching unstripped twin, never from the
                // stripped production AAR packaged into the application.
                unstrippedNativeLibsDir gelWebRtcSymbolsDir
            }
            minifyEnabled = true
            shrinkResources = true

            debuggable = false
            jniDebuggable = false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                           'proguard-rules.pro'
        }

        debug {
            minifyEnabled = false
            debuggable = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'

    // -------------------------------------------------
    // QR / BARCODE
    // -------------------------------------------------
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.2'

    // -------------------------------------------------
    // Google Play Install Referrer
    // Preserves the Smart Service Session across install -> first open.
    // -------------------------------------------------
    implementation "com.android.installreferrer:installreferrer:2.2"

    implementation "androidx.work:work-runtime:2.9.0"

    // -------------------------------------------------
    // Guava concurrency API required by WorkManager Worker
    // Provides com.google.common.util.concurrent.ListenableFuture
    // -------------------------------------------------
    implementation 'com.google.guava:guava:33.6.0-android'

    // -------------------------------------------------
    // AndroidX DataStore Preferences
    // Required at runtime by Firebase/AndroidX code path
    // that references PreferenceDataStoreDelegateKt
    // -------------------------------------------------
    implementation "androidx.datastore:datastore-preferences:1.2.1"

    // -------------------------------------------------
    // Firebase — Technician / Customer real-time pairing
    // BoM keeps Firebase Android SDK versions compatible.
    // -------------------------------------------------
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.google.firebase:firebase-crashlytics-ndk'

    // -------------------------------------------------
    // WebRTC — GEL-only Remote Assist live video + DataChannel control
    // -------------------------------------------------
    implementation files(gelWebRtcProductionAar)

    // -------------------------------------------------
    // Google Play Billing
    // -------------------------------------------------
    def billing_version = "9.1.0"
    implementation "com.android.billingclient:billing:$billing_version"

    // 🔥 Java 8+ API support (LocalDateTime etc)
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}

tasks.register("verifyGelWebRtcProductionAar") {
    group = "verification"
    description = "Verifies the immutable promoted GEL WebRTC production AAR."

    doLast {
        if (!gelWebRtcProductionAar.isFile()) {
            throw new GradleException(
                    "Missing promoted WebRTC AAR: ${gelWebRtcProductionAar}. " +
                    "Run: bash tools/webrtc/fetch_promoted_webrtc.sh --production-only"
            )
        }

        def digest = java.security.MessageDigest.getInstance("SHA-256")
        gelWebRtcProductionAar.withInputStream { input ->
            byte[] buffer = new byte[1024 * 1024]
            int count
            while ((count = input.read(buffer)) != -1) {
                if (count > 0) {
                    digest.update(buffer, 0, count)
                }
            }
        }

        def actualSha256 = digest.digest().encodeHex().toString()
        if (!actualSha256.equalsIgnoreCase(gelWebRtcProductionSha256)) {
            throw new GradleException(
                    "Promoted WebRTC AAR SHA-256 mismatch. " +
                    "expected=${gelWebRtcProductionSha256}, actual=${actualSha256}"
            )
        }

        println "WEBRTC_PRODUCTION_AAR_VERIFIED=YES"
    }
}

tasks.register("verifyGelWebRtcCrashlyticsSymbols") {
    group = "verification"
    description = "Requires the matching WebRTC unstripped libraries before Crashlytics upload."

    doLast {
        ["arm64-v8a", "armeabi-v7a"].each { abi ->
            def symbolSo = new File(gelWebRtcSymbolsDir, "${abi}/${gelWebRtcLibrary}")
            if (!symbolSo.isFile()) {
                throw new GradleException(
                        "Missing matching WebRTC symbols for ${abi}: ${symbolSo}. " +
                        "Run: bash tools/webrtc/fetch_promoted_webrtc.sh --with-symbols"
                )
            }
        }

        println "WEBRTC_CRASHLYTICS_SYMBOL_INPUTS_PRESENT=YES"
    }
}

tasks.named("preBuild").configure {
    dependsOn("verifyGelWebRtcProductionAar")
}

tasks.matching { task ->
    task.name.startsWith("uploadCrashlyticsSymbolFile")
}.configureEach {
    dependsOn("verifyGelWebRtcCrashlyticsSymbols")
}

