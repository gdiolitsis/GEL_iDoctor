pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        // Prefer Google Cloud's Maven Central mirror to avoid GitHub runner 429s.
        // Official Maven Central remains as fallback; no dependencies are disabled.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}

rootProject.name = "GEL_Android_Cleaner"
include(":app")
