name: Main checkpoint debug APK
on:
  push:
    branches: ['ci/apk-main-2113c74-20261109']
    paths: ['.github/workflows/main-checkpoint-debug-apk.yml']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2113c74dc0089f39096d62f6b8aea13e8b3ebf86
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Verify exact main source and build debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2113c74dc0089f39096d62f6b8aea13e8b3ebf86
          test "$(git rev-parse HEAD^{tree})" = 3661cc96e9adb054ebac6667f917e2ce35c7f04d
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          bash tools/webrtc/fetch_promoted_webrtc.sh --production-only
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain
          mkdir -p "$RUNNER_TEMP/main-apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/main-apk/GEL_iDoctor_main_2113c74_debug.apk"
          git rev-parse HEAD > "$RUNNER_TEMP/main-apk/SOURCE_COMMIT"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/main-apk/SOURCE_TREE"
          (cd "$RUNNER_TEMP/main-apk" && sha256sum GEL_iDoctor_main_2113c74_debug.apk > SHA256SUMS)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/main-apk/GEL_iDoctor_main_2113c74_debug.apk" > "$RUNNER_TEMP/main-apk/SIGNING_CERTIFICATE.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$RUNNER_TEMP/main-apk/GEL_iDoctor_main_2113c74_debug.apk" > "$RUNNER_TEMP/main-apk/APK_METADATA.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: GEL-iDoctor-main-2113c74-debug-APK
          path: ${{ runner.temp }}/main-apk
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: main-2113c74-unit-test-results
          path: app/build/test-results/testDebugUnitTest
          retention-days: 14
