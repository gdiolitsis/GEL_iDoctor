name: Generate GEL sample report preview PNGs

on:
  push:
    branches:
      - fix/service-report-preview-separators-20261126
    paths:
      - tools/ci/generate_service_report_preview.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image renderer
        run: python -m pip install Pillow==11.3.0
      - name: Generate two anonymous sample PNGs
        run: python tools/ci/generate_service_report_preview.py
      - name: Commit generated resource images to this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable/gel_report_preview_first.png app/src/main/res/drawable/gel_report_preview_final.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(service-report): update sample report preview pages"
            git push origin "HEAD:refs/heads/fix/service-report-preview-separators-20261126"
          fi
