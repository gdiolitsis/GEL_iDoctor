name: Apple bibliography requires current model declaration QA
on:
  pull_request:
    paths:
      - 'app/src/main/java/com/gel/cleaner/MainActivity.java'
      - 'app/src/test/java/com/gel/cleaner/AppleTroubleshootingLibraryTest.java'
      - '.github/workflows/qa-apple-fresh-model-selection.yml'
permissions:
  contents: read
jobs:
  build-and-tests:
    if: ${{ github.event.pull_request.head.ref == 'qa/apple-library-require-fresh-model-declaration-20261123' && github.event.pull_request.base.ref == 'release/v75-signed-qa-20261123' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Compile and run all unit tests; no APK or main change
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          bash tools/webrtc/fetch_promoted_webrtc.sh --production-only
          ./gradlew :app:compileDebugJavaWithJavac :app:testDebugUnitTest --no-daemon --console=plain
