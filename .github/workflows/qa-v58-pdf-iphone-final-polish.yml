name: v58 PDF and iPhone one-log polish QA

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/gel/cleaner/IPhoneLabsActivity.java'
      - 'app/src/main/java/com/gel/cleaner/ManualTestsActivity.java'
      - 'app/src/main/java/com/gel/cleaner/ServiceReportActivity.java'
      - 'app/src/main/java/com/gel/cleaner/GELServiceLog.java'
      - 'app/src/test/java/com/gel/cleaner/IPhoneEvidenceClarityContractTest.java'
      - 'app/src/test/java/com/gel/cleaner/GELServiceLogPdfColorTest.java'
      - 'app/src/test/java/com/gel/cleaner/IPhonePdfFinalPolishContractTest.java'
      - '.github/workflows/qa-v58-pdf-iphone-final-polish.yml'

permissions:
  contents: read

jobs:
  iphone-presentation:
    if: ${{ github.head_ref == 'qa/v58-pdf-iphone-final-polish-20261117' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Compile actual application and run full unit-test suite
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          bash tools/webrtc/fetch_promoted_webrtc.sh --production-only
          ./gradlew :app:compileDebugJavaWithJavac :app:testDebugUnitTest --no-daemon --console=plain
