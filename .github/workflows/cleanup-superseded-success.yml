name: Cleanup Superseded Successful Runs

on:
  push:
    branches:
      - crash-observability-v49
    paths:
      - '.github/workflows/cleanup-superseded-success.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded successful Pages runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          target_workflow_id="334170477"
          keep_run_id="39925007527"
          obsolete_cleanup_run_id="40093111786"

          echo "Keeping latest successful Pages run: ${keep_run_id}"

          mapfile -t ids < <(
            gh api --paginate               -H "Accept: application/vnd.github+json"               "/repos/${repo}/actions/runs?status=success&per_page=100"               --jq ".workflow_runs[] | select(.workflow_id == ${target_workflow_id}) | .id"
          )

          deleted=0
          for id in "${ids[@]}"; do
            if [ "${id}" = "${keep_run_id}" ]; then
              continue
            fi
            echo "Deleting superseded successful Pages run ${id}"
            gh api --method DELETE "/repos/${repo}/actions/runs/${id}"
            deleted=$((deleted + 1))
          done

          if gh api "/repos/${repo}/actions/runs/${obsolete_cleanup_run_id}" >/dev/null 2>&1; then
            echo "Deleting obsolete prior cleanup run ${obsolete_cleanup_run_id}"
            gh api --method DELETE "/repos/${repo}/actions/runs/${obsolete_cleanup_run_id}"
          fi

          echo "SUPERSEDED_SUCCESSFUL_PAGES_RUNS_DELETED=${deleted}"
