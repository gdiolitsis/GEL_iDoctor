name: iPhone panic evidence and SMC isolation targeted QA

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/gel/cleaner/IPhonePanicRepairEvidenceReview.java'
      - 'app/src/main/java/com/gel/cleaner/IPhonePanicRepairKnowledgeBase.java'
      - 'app/src/main/java/com/gel/cleaner/ApplePanicHardwareHints.java'
      - 'app/src/main/java/com/gel/cleaner/IPhoneLabsActivity.java'
      - 'app/src/test/java/com/gel/cleaner/IPhonePanicRepairEvidenceReviewTest.java'
      - 'app/src/test/java/com/gel/cleaner/IPhonePanicRepairKnowledgeBaseTest.java'
      - 'app/src/test/java/com/gel/cleaner/IPhoneSmcCommunityHintIsolationTest.java'
      - 'app/src/test/java/com/gel/cleaner/IPhoneRepairKnowledgeIntegrationContractTest.java'
      - '.github/workflows/qa-iphone-panic-evidence-targeted.yml'

permissions:
  contents: read

jobs:
  exact-model-incident-evidence:
    if: ${{ github.head_ref == 'research/iphone-panic-repair-knowledge-20261121' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Compile and run only exact-model evidence/provenance tests (no unrelated Robolectric network tests)
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          bash tools/webrtc/fetch_promoted_webrtc.sh --production-only
          ./gradlew :app:compileDebugJavaWithJavac :app:testDebugUnitTest \
            --tests com.gel.cleaner.IPhonePanicRepairEvidenceReviewTest \
            --tests com.gel.cleaner.IPhonePanicRepairKnowledgeBaseTest \
            --tests com.gel.cleaner.IPhoneSmcCommunityHintIsolationTest \
            --tests com.gel.cleaner.IPhoneRepairKnowledgeIntegrationContractTest \
            --no-daemon --console=plain
