name: QA v60 selective v61-v62 without Shizuku

on:
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/qa-v60-selective-no-shizuku.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-test:
    if: ${{ github.head_ref == 'qa/v60-plus-v61v62-without-shizuku-20261119' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Assert public Android app has no Shizuku dependency
        run: |
          set -euo pipefail
          if grep -RinE 'Shizuku|moe\.shizuku' app/src/main app/build.gradle; then
            echo "Unexpected Shizuku dependency or source in v60 baseline" >&2
            exit 1
          fi
      - name: Compile and run all JVM unit tests (no signed APK)
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          bash tools/webrtc/fetch_promoted_webrtc.sh --production-only
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain
