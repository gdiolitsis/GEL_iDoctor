name: iPhone panic evidence presentation QA

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/gel/cleaner/IPhoneLabsActivity.java'
      - 'app/src/main/java/com/gel/cleaner/ApplePanicModelEvidence.java'
      - 'app/src/main/java/com/gel/cleaner/iphone/iPhoneSpecs.java'
      - 'app/src/test/java/com/gel/cleaner/ApplePanicModelEvidenceTest.java'
      - 'app/src/test/java/com/gel/cleaner/IPhoneDemoEvidencePresentationContractTest.java'
      - 'app/src/test/java/com/gel/cleaner/IPhoneHumanReadableReportContractTest.java'
      - '.github/workflows/qa-iphone-demo-evidence-review.yml'

permissions:
  contents: read

jobs:
  iphone-evidence-build:
    if: ${{ github.head_ref == 'qa/v56-iphone-demo-evidence-and-summary-20261116' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Compile full app and run all Android unit tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          bash tools/webrtc/fetch_promoted_webrtc.sh --production-only
          ./gradlew :app:compileDebugJavaWithJavac :app:testDebugUnitTest --no-daemon --console=plain
