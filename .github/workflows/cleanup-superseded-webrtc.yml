name: Cleanup Superseded WebRTC Runs

on:
  push:
    branches:
      - crash-observability-v49
    paths:
      - '.github/workflows/cleanup-superseded-webrtc.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only canonical WebRTC build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          keep_run_id="40094612980"
          workflow_id="394916480"

          mapfile -t ids < <(
            gh api --paginate               -H "Accept: application/vnd.github+json"               "/repos/${repo}/actions/runs?per_page=100"               --jq ".workflow_runs[] | select(.workflow_id == ${workflow_id}) | .id"
          )

          deleted=0
          for id in "${ids[@]}"; do
            if [ "${id}" = "${keep_run_id}" ]; then
              continue
            fi
            echo "Deleting superseded WebRTC build run ${id}"
            gh api --method DELETE "/repos/${repo}/actions/runs/${id}"
            deleted=$((deleted + 1))
          done

          echo "WEBRTC_SUPERSEDED_RUNS_DELETED=${deleted}"
