name: v56 — signed GEL iDoctor APK and AAB
on:
  push:
    branches: [release/v56-service-report]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'gradle.properties'
      - '.github/workflows/v56-signed-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v56-signed-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-v56:
    if: ${{ github.ref == 'refs/heads/release/v56-service-report' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Check update keystore certificate matches installed v53 (fail closed)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gel-qa-signing.jks"
          test -s "$RUNNER_TEMP/gel-qa-signing.jks"
          expected='73b2c36144a1c814c92fea0ee71a6be408c2f111db20bddea24f95ad958b0964'
          actual="$(keytool -list -v -keystore "$RUNNER_TEMP/gel-qa-signing.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | awk '/SHA256:/ {print $2; exit}' | tr -d ':\r ' | tr '[:upper:]' '[:lower:]')"
          if [ "$actual" != "$expected" ]; then
            echo "SIGNING_CERT_MISMATCH: cannot update current v53 with this key; aborting" >&2
            exit 1
          fi
          echo "MATCHES_INSTALLED_V53_CERTIFICATE=YES"

      - name: Enforce no Shizuku before signing
        shell: bash
        run: |
          set -euo pipefail
          if grep -RinE 'Shizuku|moe\\.shizuku' app/src/main app/build.gradle; then
            echo "Unexpected Shizuku runtime source in no-Shizuku QA build" >&2
            exit 1
          fi
      - name: Build and verify the signed v56 APK and AAB
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/iphone/verify_apple_repair_source_coverage.py
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          bash tools/webrtc/fetch_promoted_webrtc.sh --production-only
          attempt=1
          while true; do
            log="$RUNNER_TEMP/gel-gradle-qa-$attempt.log"
            if ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease --no-daemon --console=plain 2>&1 | tee "$log"; then break; fi
            if [ "$attempt" -ge 3 ] || ! grep -Eqi '(status code 429|HTTP 429|Too Many Requests|MavenArtifactFetcher|FileNotFoundException)' "$log"; then
              echo "Gradle failed; will not sign candidate" >&2
              exit 1
            fi
            sleep $((attempt * 30))
            attempt=$((attempt + 1))
          done
          tools="$ANDROID_HOME/build-tools/36.0.0"
          unsigned='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$unsigned"
          out="$RUNNER_TEMP/candidate-apk"
          mkdir -p "$out"
          "$tools/zipalign" -f 4 "$unsigned" "$out/gel-v56-aligned.apk"
          "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/gel-qa-signing.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_ALIAS_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$out/GEL_iDoctor_v56_updated_signed.apk" "$out/gel-v56-aligned.apk"
          "$tools/apksigner" verify --verbose "$out/GEL_iDoctor_v56_updated_signed.apk"
          "$tools/zipalign" -c -v 4 "$out/GEL_iDoctor_v56_updated_signed.apk"
          expected='73b2c36144a1c814c92fea0ee71a6be408c2f111db20bddea24f95ad958b0964'
          actual="$("$tools/apksigner" verify --print-certs "$out/GEL_iDoctor_v56_updated_signed.apk" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}')"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "SIGNED_APK_CERTIFICATE_MISMATCH_OR_UNREADABLE" >&2
            exit 1
          fi
          echo "SIGNED_APK_CERTIFICATE=PASS"
          "$tools/aapt2" dump badging "$out/GEL_iDoctor_v56_updated_signed.apk" > "$out/APK_BADGING.txt"
          package_line="$(head -n 1 "$out/APK_BADGING.txt")"
          echo "APK_BADGING_PACKAGE_LINE: $package_line"
          [[ "$package_line" == package:* ]] || { echo "INVALID_BADGING"; exit 1; }
          [[ "$package_line" == *"name='com.gel.iDoctor'"* ]] || { echo "INVALID_APK_PACKAGE"; exit 1; }
          [[ "$package_line" =~ versionCode=\'([0-9]+)\' ]] || { echo "MISSING_VERSION_CODE"; exit 1; }
          code="${BASH_REMATCH[1]}"
          [[ "$code" == 82 ]] || { echo "INVALID_V56_VERSION_CODE: $code"; exit 1; }
          [[ "$package_line" =~ versionName=\'([^\']+)\' ]] || { echo "MISSING_VERSION_NAME"; exit 1; }
          version_name="${BASH_REMATCH[1]}"
          [[ "$version_name" == '5.6' ]] || { echo "INVALID_V56_VERSION_NAME: $version_name"; exit 1; }
          echo "V56_PACKAGE_VERSION: $code $version_name"
          echo "APK_PACKAGE_VERSION=PASS"
          bundle="$out/GEL_iDoctor_v56_signed.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$bundle"
          jarsigner -keystore "$RUNNER_TEMP/gel-qa-signing.jks" \
            -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_ALIAS_PASSWORD \
            "$bundle" "$KEY_ALIAS"
          LC_ALL=C jarsigner -verify "$bundle" | tee "$out/AAB_SIGNATURE.txt"
          grep -Fx 'jar verified.' "$out/AAB_SIGNATURE.txt"
          aab_cert="$(LC_ALL=C keytool -printcert -jarfile "$bundle" \
            | awk '/SHA256:/ {gsub(/:/,"",$2); print tolower($2); exit}')"
          test "$aab_cert" = "$expected"
          printf '%s\n' "$aab_cert" > "$out/AAB_SIGNER_CERT_SHA256"

          curl --fail --location --retry 4 \
            'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' \
            --output "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' \
            "$RUNNER_TEMP/bundletool.jar" | sha256sum --check
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$bundle"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$bundle" \
            > "$out/AAB_MANIFEST.xml"
          python3 tools/ci/verify_release_manifest.py "$out/AAB_MANIFEST.xml" 82 5.6
          echo "SIGNED_AAB_VERIFIED=PASS"
          (cd "$out" && sha256sum GEL_iDoctor_v56_updated_signed.apk GEL_iDoctor_v56_signed.aab > SHA256SUMS)
          git rev-parse HEAD > "$out/SOURCE_COMMIT"
          printf '%s\n' "$actual" > "$out/SIGNER_CERT_SHA256"
          rm -f "$out/gel-v56-aligned.apk" "$RUNNER_TEMP/gel-qa-signing.jks"
          echo "SIGNED_QA_UPDATE_WITH_INSTALLED_CERTIFICATE=PASS"
      - uses: actions/upload-artifact@v6
        with:
          name: GEL_iDoctor_v56_signed_APK_and_AAB
          path: ${{ runner.temp }}/candidate-apk
          if-no-files-found: error
          retention-days: 7
