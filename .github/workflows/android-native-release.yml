name: v51 Release Candidate — APK + AAB + Crashlytics Symbols

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gel-idoctor-v51-release-candidate
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install release verification dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y binutils curl unzip zip

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" \
            --output "$RUNNER_TEMP/bundletool.jar"

          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" \
            | sha256sum -c -

      - name: Verify canonical Gradle wrapper
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --version

      - name: Fetch promoted WebRTC production and Crashlytics symbols
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x tools/webrtc/fetch_promoted_webrtc.sh
          tools/webrtc/fetch_promoted_webrtc.sh --with-symbols

          test -s app/libs/libwebrtc-gel-144.7559.15.aar
          test -s .webrtc-symbols/144.7559.15/arm64-v8a/libjingle_peerconnection_so.so
          test -s .webrtc-symbols/144.7559.15/armeabi-v7a/libjingle_peerconnection_so.so

      - name: Verify Crashlytics release tasks exist
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            app:tasks --all \
            | tee "$RUNNER_TEMP/gradle-tasks.txt"

          grep -F "uploadCrashlyticsSymbolFileRelease" "$RUNNER_TEMP/gradle-tasks.txt"
          grep -F "uploadCrashlyticsMappingFileRelease" "$RUNNER_TEMP/gradle-tasks.txt"

          echo "CRASHLYTICS_RELEASE_TASKS=PASS"

      - name: Build v51 release APK and AAB
        shell: bash
        run: |
          set -euxo pipefail

          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            clean \
            app:assembleRelease \
            app:bundleRelease

          test -s app/build/outputs/bundle/release/app-release.aab
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print

          echo "V51_RELEASE_BUILD=PASS"

      - name: Upload Crashlytics Java and native symbols
        shell: bash
        run: |
          set -euxo pipefail

          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            app:uploadCrashlyticsMappingFileRelease \
            app:uploadCrashlyticsSymbolFileRelease

          echo "CRASHLYTICS_MAPPING_UPLOAD=PASS"
          echo "CRASHLYTICS_NATIVE_SYMBOL_UPLOAD=PASS"

      - name: Verify packaged WebRTC Build IDs
        shell: bash
        run: |
          set -euxo pipefail

          source tools/webrtc/webrtc-promoted.env

          APK_DIR="$GITHUB_WORKSPACE/app/build/outputs/apk/release"
          APK="$(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              ! -name '*_aligned.apk' \
              ! -name '*_signed.apk' \
              | head -n 1
          )"
          AAB="$GITHUB_WORKSPACE/app/build/outputs/bundle/release/app-release.aab"

          test -s "$APK"
          test -s "$AAB"

          AUDIT="$RUNNER_TEMP/webrtc-package-audit"
          mkdir -p "$AUDIT"

          verify_id() {
            local archive="$1"
            local entry="$2"
            local expected="$3"
            local label="$4"
            local out="$AUDIT/${label}.so"
            local actual

            unzip -p "$archive" "$entry" > "$out"
            test -s "$out"

            actual="$(readelf -n "$out" | awk '/Build ID:/ {print $3; exit}')"

            echo "$label expected: $expected"
            echo "$label actual  : $actual"

            test -n "$actual"
            test "$actual" = "$expected"
          }

          verify_id "$APK" "lib/arm64-v8a/$WEBRTC_LIBRARY" "$WEBRTC_ARM64_BUILD_ID" "apk-arm64"
          verify_id "$APK" "lib/armeabi-v7a/$WEBRTC_LIBRARY" "$WEBRTC_ARMV7_BUILD_ID" "apk-armv7"
          verify_id "$AAB" "base/lib/arm64-v8a/$WEBRTC_LIBRARY" "$WEBRTC_ARM64_BUILD_ID" "aab-arm64"
          verify_id "$AAB" "base/lib/armeabi-v7a/$WEBRTC_LIBRARY" "$WEBRTC_ARMV7_BUILD_ID" "aab-armv7"

          if unzip -l "$APK" | grep -q "lib/x86_64/$WEBRTC_LIBRARY"; then
            echo "ERROR: unexpected x86_64 WebRTC library in release APK"
            exit 1
          fi

          if unzip -l "$AAB" | grep -q "base/lib/x86_64/$WEBRTC_LIBRARY"; then
            echo "ERROR: unexpected x86_64 WebRTC library in release AAB"
            exit 1
          fi

          echo "PACKAGED_WEBRTC_BUILD_IDS=PASS"

      - name: Decode upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 --decode > gel-keystore.jks
          test -s gel-keystore.jks

      - name: Align and sign release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK_DIR="$GITHUB_WORKSPACE/app/build/outputs/apk/release"

          APK="$(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              ! -name '*_aligned.apk' \
              ! -name '*_signed.apk' \
              | head -n 1
          )"

          test -s "$APK"

          "$BUILD_TOOLS/zipalign" \
            -f \
            4 \
            "$APK" \
            "$APK_DIR/GEL_iDoctor_v5.1_aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/gel-keystore.jks" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_ALIAS_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$APK_DIR/GEL_iDoctor_v5.1_signed.apk" \
            "$APK_DIR/GEL_iDoctor_v5.1_aligned.apk"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK_DIR/GEL_iDoctor_v5.1_signed.apk"

          echo "SIGNED_APK_VERIFIED=PASS"

      - name: Sign release AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          AAB_DIR="$GITHUB_WORKSPACE/app/build/outputs/bundle/release"
          SOURCE="$AAB_DIR/app-release.aab"
          SIGNED="$AAB_DIR/GEL_iDoctor_v5.1_signed.aab"

          test -s "$SOURCE"
          cp "$SOURCE" "$SIGNED"

          jarsigner \
            -keystore "$GITHUB_WORKSPACE/gel-keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_ALIAS_PASSWORD" \
            "$SIGNED" \
            "$KEY_ALIAS"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$SIGNED"

          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$SIGNED"

          echo "SIGNED_AAB_VERIFIED=PASS"
          echo "BUNDLETOOL_VALIDATE=PASS"

      - name: Verify v51 Play release identity
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/release/GEL_iDoctor_v5.1_signed.apk"

          "$BUILD_TOOLS/aapt2" dump badging "$APK" \
            | tee "$RUNNER_TEMP/v51-badging.txt"

          grep -F "package: name='com.gel.iDoctor' versionCode='51' versionName='5.1'" \
            "$RUNNER_TEMP/v51-badging.txt"

          grep -Fx "minSdkVersion:'26'" "$RUNNER_TEMP/v51-badging.txt"
          grep -F "targetSdkVersion:'36'" "$RUNNER_TEMP/v51-badging.txt"

          echo "V51_PLAY_IDENTITY=PASS"

      - name: Verify v50 regression and v51 release startup on Android 11
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sdkmanager "emulator" "system-images;android-30;google_apis;x86_64"
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --name gel_release_smoke --package "system-images;android-30;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd gel_release_smoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          trap 'adb emu kill || true' EXIT
          adb wait-for-device
          booted=false
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then booted=true; break; fi
            sleep 2
          done
          test "$booted" = true
          adb shell input keyevent 82
          adb shell getprop ro.product.cpu.abilist | tee "$RUNNER_TEMP/smoke-abis.txt"
          grep -q arm64-v8a "$RUNNER_TEMP/smoke-abis.txt"

          # Reproduce the actual shipped v50 crash before accepting the fix.
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/gdiolitsis/GEL_iDoctor/actions/artifacts/12580210846/zip" \
            -o "$RUNNER_TEMP/v50-baseline.zip"
          mkdir -p "$RUNNER_TEMP/v50-baseline" "$RUNNER_TEMP/startup-evidence"
          unzip -q "$RUNNER_TEMP/v50-baseline.zip" -d "$RUNNER_TEMP/v50-baseline"
          BASELINE="$(find "$RUNNER_TEMP/v50-baseline" -name '*.apk' -print -quit)"
          if bash tools/ci/release_startup_smoke.sh "$BASELINE" "$RUNNER_TEMP/startup-evidence/v50"; then
            echo "ERROR: v50 did not reproduce the reported startup failure"
            exit 1
          fi
          grep -F "Failed to create an instance of class" "$RUNNER_TEMP/startup-evidence/v50/logcat.txt"
          grep -F "WorkDatabase" "$RUNNER_TEMP/startup-evidence/v50/logcat.txt"
          adb uninstall com.gel.iDoctor
          bash tools/ci/release_startup_smoke.sh \
            app/build/outputs/apk/release/GEL_iDoctor_v5.1_signed.apk \
            "$RUNNER_TEMP/startup-evidence/v51"
          echo "V50_REGRESSION_REPRODUCED=PASS"
          echo "V51_RELEASE_STARTUP=PASS"

      - name: Upload startup diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: GEL_iDoctor_v51_startup_evidence
          path: |
            ${{ runner.temp }}/startup-evidence
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/smoke-abis.txt
          if-no-files-found: warn

      - name: Generate release-candidate evidence
        shell: bash
        run: |
          set -euxo pipefail

          source tools/webrtc/webrtc-promoted.env

          {
            echo "GEL iDoctor v51 release-candidate evidence"
            echo
            echo "git_commit=$GITHUB_SHA"
            echo "application_id=com.gel.iDoctor"
            echo "version_code=51"
            echo "version_name=5.1"
            echo "target_sdk=36"
            echo "webrtc_tag=$WEBRTC_PROMOTED_TAG"
            echo "webrtc_production_sha256=$WEBRTC_PRODUCTION_SHA256"
            echo "webrtc_unstripped_sha256=$WEBRTC_UNSTRIPPED_SHA256"
            echo "arm64-v8a_build_id=$WEBRTC_ARM64_BUILD_ID"
            echo "armeabi-v7a_build_id=$WEBRTC_ARMV7_BUILD_ID"
            echo "crashlytics_mapping_upload=PASS"
            echo "crashlytics_native_symbol_upload=PASS"
            echo "packaged_webrtc_build_ids=PASS"
            echo "bundletool_validate=PASS"
            echo "release_identity=PASS"
            echo "v50_startup_regression_reproduced=PASS"
            echo "v51_release_startup_android_11=PASS"
          } > "$GITHUB_WORKSPACE/V51-RELEASE-CANDIDATE-EVIDENCE.txt"

          cat "$GITHUB_WORKSPACE/V51-RELEASE-CANDIDATE-EVIDENCE.txt"

      - name: Upload signed v51 APK
        uses: actions/upload-artifact@v6
        with:
          name: GEL_iDoctor_v51_APK
          path: app/build/outputs/apk/release/GEL_iDoctor_v5.1_signed.apk
          if-no-files-found: error

      - name: Upload signed v51 AAB
        uses: actions/upload-artifact@v6
        with:
          name: GEL_iDoctor_v51_AAB
          path: app/build/outputs/bundle/release/GEL_iDoctor_v5.1_signed.aab
          if-no-files-found: error

      - name: Upload v51 release evidence and mapping
        uses: actions/upload-artifact@v6
        with:
          name: GEL_iDoctor_v51_release_evidence
          path: |
            V51-RELEASE-CANDIDATE-EVIDENCE.txt
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
