name: Manual Build — GEL iDoctor (APK + AAB)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify canonical Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Decode upload keystore
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > gel-keystore.jks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK + AAB
        run: |
          ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Align and sign APK
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK_DIR="$GITHUB_WORKSPACE/app/build/outputs/apk/release"

          APK="$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            ! -name '*aligned*' \
            ! -name '*signed*' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" \
            -f \
            4 \
            "$APK" \
            "$APK_DIR/GEL_iDoctor_aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/gel-keystore.jks" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_ALIAS_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$APK_DIR/GEL_iDoctor_signed.apk" \
            "$APK_DIR/GEL_iDoctor_aligned.apk"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$APK_DIR/GEL_iDoctor_signed.apk"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Sign and verify AAB
        run: |
          set -e

          AAB_DIR="$GITHUB_WORKSPACE/app/build/outputs/bundle/release"
          SOURCE="$AAB_DIR/app-release.aab"
          SIGNED="$AAB_DIR/GEL_iDoctor_signed.aab"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Release AAB not found."
            exit 1
          fi

          cp "$SOURCE" "$SIGNED"

          jarsigner \
            -keystore "$GITHUB_WORKSPACE/gel-keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_ALIAS_PASSWORD" \
            "$SIGNED" \
            "$KEY_ALIAS"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$SIGNED"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: GEL_iDoctor_APK
          path: app/build/outputs/apk/release/GEL_iDoctor_signed.apk

      - name: Upload signed AAB
        uses: actions/upload-artifact@v6
        with:
          name: GEL_iDoctor_AAB
          path: app/build/outputs/bundle/release/GEL_iDoctor_signed.aab
